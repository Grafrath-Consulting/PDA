<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- device body -->
  <rect x="12" y="4" width="41" height="56" rx="8" fill="#374151"/>
  <!-- inner shell -->
  <rect x="15" y="7" width="35" height="50" rx="6" fill="#F3F4F6"/>
  <!-- screen bezel -->
  <rect x="19" y="11" width="27" height="31" rx="3" fill="#374151"/>
  <!-- screen -->
  <rect x="20" y="12" width="24" height="28" rx="2" fill="#FFFFFF"/>
  <!-- content lines -->
  <line x1="21" y1="17" x2="41" y2="17" stroke="#6B7280" stroke-width="1" stroke-linecap="round"/>
  <line x1="21" y1="23" x2="46" y2="23" stroke="#6B7280" stroke-width="1" stroke-linecap="round"/>
  <line x1="21" y1="29" x2="41" y2="29" stroke="#6B7280" stroke-width="1" stroke-linecap="round"/>
  <line x1="21" y1="35" x2="46" y2="35" stroke="#6B7280" stroke-width="1" stroke-linecap="round"/>
  <!-- home button ring -->
  <circle cx="32" cy="52" r="4" fill="none" stroke="#374151" stroke-width="1"/>
  <!-- home button dot -->
  <circle cx="32" cy="52" r="2" fill="#374151"/>
  <rect x="10" y="20" width="3" height="9" rx="1" fill="#4B5563"/>
</svg>
